name: Verify Grokbot
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node tests/smooth-text.mjs
      - run: node tests/camera-lifecycle.mjs
      - run: node tests/message-rendering.mjs
      - run: npm run build
      - run: node tests/native-auth.mjs
        env:
          SESSION_SECRET: ci-native-test-value
          DB_PATH: ":memory:"
      - run: node tests/chat-attachments.mjs
        env:
          SESSION_SECRET: ci-attachment-test-value
          DB_PATH: ':memory:'
      - run: node tests/photo-messages.mjs
        env:
          SESSION_SECRET: ci-photo-test-value
          DB_PATH: ':memory:'
      - run: node tests/create-bot.mjs
        env:
          SESSION_SECRET: ci-bot-test-value
          DB_PATH: ':memory:'
      - run: node tests/connected-apps.mjs
        env:
          SESSION_SECRET: ci-only-test-value
          DB_PATH: ':memory:'
      - run: node tests/permissions.mjs
        env:
          SESSION_SECRET: ci-permission-test-value
          DB_PATH: ':memory:'
      - run: node tests/sheet-preview.mjs
        env:
          SESSION_SECRET: ci-sheet-test-value
          DB_PATH: ':memory:'
      - run: node tests/audio-recording.mjs
      - run: node tests/transcription.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r infra/documents/requirements.txt
      - run: node tests/uploaded-documents.mjs
        env:
          SESSION_SECRET: ci-document-test-value
          DB_PATH: ':memory:'
          DOCUMENT_PYTHON: python
      - run: node tests/avatar-characters.mjs
      - run: node tests/push-service-worker.mjs
      - run: node tests/notifications.mjs
        env:
          SESSION_SECRET: ci-push-test-value
          DB_PATH: ':memory:'
