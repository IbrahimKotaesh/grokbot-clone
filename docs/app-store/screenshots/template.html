<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 6.9" iPhone App Store screenshot, 1320 x 2868. Big two-line headline, big phone, Badr and his
     teammates floating around it. No small labels. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1320px; height: 2868px; overflow: hidden; }
  body { position: relative; font-family: "Inter Tight", -apple-system, sans-serif; }
  [lang="ar"] body { font-family: "IBM Plex Sans Arabic", "Geeza Pro", sans-serif; }
  .bg { position: absolute; inset: 0; }

  /* Styles */
  .s-color .bg { background: radial-gradient(1200px 900px at 50% 105%, rgba(255,255,255,.28), transparent 60%), linear-gradient(165deg, var(--c1) 0%, var(--c2) 100%); }
  .s-color h1 { color: #fff; } .s-color h1 em { color: var(--em); }
  .s-light .bg { background: radial-gradient(1000px 800px at 50% 80%, color-mix(in srgb, var(--c1) 22%, transparent), transparent 70%), #f6f3ee; }
  .s-light h1 { color: #111114; } .s-light h1 em { color: var(--c1); }
  .s-dark .bg { background: #08080b; }
  .s-dark .blob { position: absolute; border-radius: 50%; filter: blur(140px); opacity: .85; }
  .s-dark h1 { color: #fff; }
  .s-dark h1 em { background: linear-gradient(90deg, var(--c1), var(--c2)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  h1 { position: absolute; top: 190px; left: 80px; right: 80px; z-index: 5; text-align: center;
    font-weight: 800; font-size: 178px; line-height: 1.0; letter-spacing: -.045em; white-space: nowrap; }
  h1 em { font-style: normal; }
  [lang="ar"] h1 { direction: rtl; font-weight: 700; font-size: 168px; line-height: 1.18; letter-spacing: 0; top: 170px; }

  /* Phone */
  .phone { position: absolute; top: 820px; left: 160px; width: 1000px; z-index: 3; transform: rotate(var(--tilt, 0deg)); transform-origin: 50% 40%; }
  .body { position: relative; border-radius: 146px; padding: 20px;
    background: linear-gradient(150deg, #5b5c63 0%, #2a2b30 14%, #1b1c20 50%, #34353b 100%);
    box-shadow: inset 0 0 0 2px #6a6b72, inset 0 0 0 7px #0b0b0d, 0 90px 140px rgba(0,0,0,.45), 0 30px 50px rgba(0,0,0,.3); }
  .screen { position: relative; border-radius: 126px; overflow: hidden; background: #000; }
  .screen img { display: block; width: 100%; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 112px; background: #000; direction: ltr; z-index: 2;
    display: flex; align-items: center; justify-content: space-between; padding: 8px 88px 0 108px;
    font: 600 42px/1 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; color: #fff; }
  .status .icons { display: flex; align-items: center; gap: 13px; }
  .island { position: absolute; top: 28px; left: 50%; transform: translateX(-50%); width: 290px; height: 84px; border-radius: 50px; background: #000; z-index: 3; }

  /* The screenshots carry their own status bar. */
  .status { display: none; }
  /* Characters */
  .fruit { position: absolute; z-index: 6; filter: drop-shadow(0 40px 40px rgba(0,0,0,.35)) drop-shadow(0 10px 12px rgba(0,0,0,.2)); }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <h1 id="title"></h1>
  <div id="stage"></div>
<script>
  // ?lang=en|ar &style=color|light|dark &title= (*accent*, | = line break) &shot= &c1= &c2= &em=
  // &px= (phone left) &tilt=deg &fruits=name:x:y:size:rot;...
  const q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  document.documentElement.lang = q.get("lang") || "en";
  const style = q.get("style") || "color";
  document.body.classList.add("s-" + style);
  for (const k of ["c1", "c2", "em"]) if (q.get(k)) document.body.style.setProperty("--" + k, q.get(k));
  if (style === "dark") {
    const c1 = q.get("c1"), c2 = q.get("c2");
    $("bg").innerHTML = `<div class="blob" style="width:900px;height:900px;left:-200px;top:1100px;background:${c1}"></div>
      <div class="blob" style="width:900px;height:900px;right:-250px;top:1700px;background:${c2}"></div>
      <div class="blob" style="width:700px;height:700px;left:310px;top:2300px;background:${c1};opacity:.5"></div>`;
  }
  $("title").innerHTML = esc(q.get("title") || "").replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/\|/g, "<br>");
  const icons = `<span class="icons">
    <svg width="44" height="29" viewBox="0 0 46 30" fill="#fff"><rect x="0" y="20" width="8" height="10" rx="2"/><rect x="12" y="14" width="8" height="16" rx="2"/><rect x="24" y="7" width="8" height="23" rx="2"/><rect x="36" y="0" width="8" height="30" rx="2"/></svg>
    <svg width="40" height="29" viewBox="0 0 42 30" fill="#fff"><path d="M21 6c6.3 0 12 2.4 16.3 6.4l3.2-3.3C35.3 4.1 28.5 1.2 21 1.2S6.7 4.1 1.5 9.1l3.2 3.3C9 8.4 14.7 6 21 6zm0 9c3.8 0 7.3 1.4 9.9 3.8l3.3-3.3C30.7 12.2 26.1 10.3 21 10.3s-9.7 1.9-13.2 5.2l3.3 3.3C13.7 16.4 17.2 15 21 15zm0 8.8c-1.5 0-2.9.6-4 1.6l4 4.1 4-4.1c-1.1-1-2.5-1.6-4-1.6z"/></svg>
    <svg width="62" height="29" viewBox="0 0 64 30"><rect x="1.5" y="1.5" width="54" height="27" rx="8" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3"/><rect x="6" y="6" width="45" height="18" rx="4.5" fill="#fff"/><path d="M59 10v10c2.2-.8 3.6-2.8 3.6-5s-1.4-4.2-3.6-5z" fill="#fff" fill-opacity=".45"/></svg></span>`;
  let html = `<div class="phone" style="left:${q.get("px") || 160}px;--tilt:${q.get("tilt") || 0}deg"><div class="body"><div class="screen">
    <div class="island"></div><div class="status"><span>9:41</span>${icons}</div><img src="${esc(q.get("shot") || "")}"></div></div></div>`;
  for (const f of (q.get("fruits") || "").split(";").filter(Boolean)) {
    const [name, x, y, size, rot] = f.split(":");
    html += `<img class="fruit" src="assets/${esc(name)}.${name.startsWith("char-") ? "svg" : "webp"}" style="left:${x}px;top:${y}px;width:${size}px;transform:rotate(${rot || 0}deg)">`;
  }
  $("stage").innerHTML = html;
  // Each headline line stays on one line: shrink until the widest line fits.
  const h1 = $("title");
  document.fonts.ready.then(() => {
    let size = parseFloat(getComputedStyle(h1).fontSize);
    while (h1.scrollWidth > h1.clientWidth && size > 100) h1.style.fontSize = (size -= 4) + "px";
  });
</script>
</body>
</html>
